<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="cineboxBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#0a121e" />
      <stop offset="100%" stop-color="#041f18" />
    </linearGradient>
    <linearGradient id="cineboxNeon" x1="80" y1="64" x2="432" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10d97b" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="cineboxPlay" x1="190" y1="160" x2="360" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34f59b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10d97b" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#cineboxBg)" stroke="url(#cineboxNeon)" stroke-width="10" />

  <!-- Subtle Cinema Film Strip Perforations (Left & Right) -->
  <g fill="#10d97b" fill-opacity="0.22">
    <rect x="46" y="110" width="22" height="32" rx="6" />
    <rect x="46" y="166" width="22" height="32" rx="6" />
    <rect x="46" y="240" width="22" height="32" rx="6" />
    <rect x="46" y="314" width="22" height="32" rx="6" />
    <rect x="46" y="370" width="22" height="32" rx="6" />

    <rect x="444" y="110" width="22" height="32" rx="6" />
    <rect x="444" y="166" width="22" height="32" rx="6" />
    <rect x="444" y="240" width="22" height="32" rx="6" />
    <rect x="444" y="314" width="22" height="32" rx="6" />
    <rect x="444" y="370" width="22" height="32" rx="6" />
  </g>

  <!-- Stylized 'C' Cinema Reel Outer Ring -->
  <path
    d="M352 142C326 116 290 100 250 100C167.157 100 100 169.843 100 256C100 342.157 167.157 412 250 412C290 412 326 396 352 370"
    stroke="url(#cineboxNeon)"
    stroke-width="34"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />

  <!-- Center 3D Cinema Play Prism -->
  <path
    d="M214 174.5C214 162.4 227.3 155.0 237.6 161.4L362.4 238.9C372.1 244.9 372.1 259.1 362.4 265.1L237.6 342.6C227.3 349.0 214 341.6 214 329.5V174.5Z"
    fill="url(#cineboxPlay)"
    filter="url(#neonGlow)"
  />

  <!-- Inner Core Accent Cutout -->
  <path
    d="M238 212L312 252L238 292V212Z"
    fill="#04131a"
    fill-opacity="0.45"
  />
</svg>
