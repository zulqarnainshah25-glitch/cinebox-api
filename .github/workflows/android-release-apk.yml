name: Build Signature-Safe Signed Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Sync Capacitor Android
        run: |
          npm install --legacy-peer-deps
          npm run build
          # Preserve custom MainActivity.java (Popup Blocker & System Bar Blending) & build.gradle (v1.0.2 Release Signing)
          cp android/app/src/main/java/com/cinebox/stream/MainActivity.java /tmp/MainActivity.java.bak
          cp android/app/build.gradle /tmp/build.gradle.bak
          npx cap sync android || true
          mkdir -p android/app/src/main/java/com/cinebox/stream
          cp /tmp/MainActivity.java.bak android/app/src/main/java/com/cinebox/stream/MainActivity.java
          cp /tmp/build.gradle.bak android/app/build.gradle
          # Remove default Capacitor adaptive icon XML so Android uses the custom CineBox launcher icon
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Verify Native WebView Popup Blocker & v1.0.3 in Android Project
        run: |
          grep -q "setSupportMultipleWindows(true)" android/app/src/main/java/com/cinebox/stream/MainActivity.java
          grep -q "onCreateWindow" android/app/src/main/java/com/cinebox/stream/MainActivity.java
          grep -q 'versionName "1.0.3"' android/app/build.gradle

      - name: Decode Persistent .jks Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CINEBOX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Assemble Signature-Safe Release APK (v1.0.3)
        working-directory: ./android
        env:
          CM_KEYSTORE_PATH: release-keystore.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.CINEBOX_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CINEBOX_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CINEBOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
