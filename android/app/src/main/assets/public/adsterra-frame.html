<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Featured Movies</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      color: #f8fafc !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      overflow: hidden !important;
      width: 100% !important;
      max-width: 100vw !important;
      height: 100% !important;
    }
    #ad-wrapper {
      position: relative !important;
      width: 100% !important;
      max-width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      display: block !important;
    }
    .adsterra-container {
      width: 100% !important;
      max-width: 100% !important;
      overflow: hidden !important;
    }

    /* Strictly hide Adsterra's internal "Ad was closed", close buttons, and report overlays */
    [class*="__close"],
    [class*="-close"],
    [class*="__closed"],
    [class*="-closed"],
    [class*="__report"],
    [class*="__cancel"],
    [class*="__logo"],
    [class*="__branding"],
    [class*="__label"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
      overflow: hidden !important;
      pointer-events: none !important;
      position: absolute !important;
      z-index: -1 !important;
    }

    /* CineBox Movie Thumbnail Grid: 3 cols on mobile, 4 cols on sm, 6 cols on md+ */
    .cinebox-ad-grid {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 10px !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      align-items: start !important;
      list-style: none !important;
    }
    @media (min-width: 640px) and (max-width: 767px) {
      .cinebox-ad-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
        gap: 12px !important;
      }
    }
    @media (min-width: 768px) {
      .cinebox-ad-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
        gap: 12px !important;
      }
    }

    /* Show exactly 1 row of movie thumbnails matching CineBox movie rows */
    @media (max-width: 639px) {
      .cinebox-ad-grid > .cinebox-ad-card:nth-child(n+4) {
        display: none !important;
      }
    }
    @media (min-width: 640px) and (max-width: 767px) {
      .cinebox-ad-grid > .cinebox-ad-card:nth-child(n+5) {
        display: none !important;
      }
    }
    @media (min-width: 768px) {
      .cinebox-ad-grid > .cinebox-ad-card:nth-child(n+7) {
        display: none !important;
      }
    }

    /* Individual Movie-Style Thumbnail Card */
    .cinebox-ad-card {
      position: relative !important;
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
      max-width: 100% !important;
      background: transparent !important;
      border: none !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      text-decoration: none !important;
      cursor: pointer !important;
      pointer-events: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      transition: transform 0.2s ease !important;
    }
    .cinebox-ad-card:hover {
      transform: translateY(-2px) !important;
    }
    .cinebox-ad-card a {
      text-decoration: none !important;
      color: #f8fafc !important;
      pointer-events: auto !important;
      cursor: pointer !important;
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
    }

    /* Top-Right Green "1080P" / "HD" Badge matching Latest Movies */
    .cinebox-ad-card::before {
      content: attr(data-badge) !important;
      position: absolute !important;
      top: 8px !important;
      right: 8px !important;
      z-index: 20 !important;
      background: #00e676 !important;
      color: #020617 !important;
      font-size: 9px !important;
      font-weight: 800 !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
      letter-spacing: 0.03em !important;
      line-height: 1.2 !important;
      pointer-events: none !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55) !important;
    }
    .cinebox-ad-card:not([data-badge])::before {
      content: "1080P" !important;
    }

    /* Poster Image Box & Image */
    .cinebox-ad-poster-box {
      position: relative !important;
      width: 100% !important;
      height: 152px !important;
      min-height: 152px !important;
      max-height: 152px !important;
      padding: 0 !important;
      margin: 0 !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      display: block !important;
      background: #121824 !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
    .cinebox-ad-card:hover .cinebox-ad-poster-box {
      border-color: rgba(0, 230, 118, 0.55) !important;
    }
    .cinebox-ad-poster-img {
      position: relative !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 152px !important;
      min-height: 152px !important;
      max-height: 152px !important;
      padding: 0 !important;
      margin: 0 !important;
      object-fit: cover !important;
      background-size: cover !important;
      background-position: center top !important;
      border-radius: 12px !important;
      display: block !important;
      transition: transform 0.3s ease !important;
    }
    .cinebox-ad-card:hover .cinebox-ad-poster-img {
      transform: scale(1.04) !important;
    }

    @media (min-width: 640px) {
      .cinebox-ad-poster-box,
      .cinebox-ad-poster-img {
        height: 224px !important;
        min-height: 224px !important;
        max-height: 224px !important;
      }
    }

    /* Movie Title & Year Caption Below Poster */
    .cinebox-ad-title {
      font-size: 12px !important;
      font-weight: 700 !important;
      line-height: 1.3 !important;
      color: #f1f5f9 !important;
      margin: 6px 0 1px 0 !important;
      padding: 0 2px !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      display: block !important;
      width: 100% !important;
      text-align: left !important;
    }
    .cinebox-ad-card:hover .cinebox-ad-title {
      color: #00e676 !important;
    }
    .cinebox-ad-year {
      font-size: 10.5px !important;
      font-weight: 500 !important;
      line-height: 1.2 !important;
      color: #64748b !important;
      margin: 0 !important;
      padding: 0 2px !important;
      display: block !important;
      text-align: left !important;
    }
    /* Automatically append "2026" below live Adsterra cards that don't have a .cinebox-ad-year element */
    .cinebox-ad-card.adsterra-live-item::after {
      content: "2026" !important;
      font-size: 10.5px !important;
      font-weight: 500 !important;
      line-height: 1.2 !important;
      color: #64748b !important;
      margin: 0 !important;
      padding: 0 2px !important;
      display: block !important;
      text-align: left !important;
    }
  </style>
</head>
<body>
  <div id="ad-wrapper">
    <!-- Live Adsterra Container -->
    <div id="container-83b5d9d90d154535d150a2bd3cf1f04e" class="adsterra-container"></div>

    <!-- Fallback / Pre-load Movie-Thumbnail Ad Grid (automatically hidden once live Adsterra cards render) -->
    <div id="cinebox-fallback-ad-grid" class="cinebox-ad-grid"></div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var slot = params.get('slot') || 'home-top';

      // Curated Movie-Poster Thumbnails so the container always looks like a real CineBox movie row
      var TOP_SLOT_CARDS = [
        {
          title: 'Shadow Protocol: Zero Hour',
          year: '2026',
          badge: '1080P',
          poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Empire of Dust',
          year: '2026',
          badge: 'HD',
          poster: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Crimson Velocity',
          year: '2026',
          badge: '1080P',
          poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'The Last Frontier',
          year: '2026',
          badge: '4K',
          poster: 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Nightfall Syndicate',
          year: '2025',
          badge: '1080P',
          poster: 'https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Apex Predator: Reborn',
          year: '2026',
          badge: 'HD',
          poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=500&q=80'
        }
      ];

      var NATIVE_SLOT_CARDS = [
        {
          title: 'Quantum Heist',
          year: '2026',
          badge: '1080P',
          poster: 'https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Silent Reckoning',
          year: '2026',
          badge: 'HD',
          poster: 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Outlaw Horizon',
          year: '2026',
          badge: '1080P',
          poster: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Cyber Valkyrie',
          year: '2025',
          badge: '4K',
          poster: 'https://images.unsplash.com/photo-1542204165-65bf26472b9b?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Bloodline Cartel',
          year: '2026',
          badge: '1080P',
          poster: 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=500&q=80'
        },
        {
          title: 'Phantom Protocol',
          year: '2026',
          badge: 'HD',
          poster: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80'
        }
      ];

      var activeFallbackCards = slot === 'home-native' ? NATIVE_SLOT_CARDS : TOP_SLOT_CARDS;
      var fallbackGrid = document.getElementById('cinebox-fallback-ad-grid');

      function handleFallbackCardClick(e, item) {
        // If Adsterra injected any live <a href="..."> link in the container, trigger that genuine ad click
        var root = document.querySelector('.adsterra-container');
        if (root) {
          var liveLink = root.querySelector('a[href^="http"]');
          if (liveLink && typeof liveLink.click === 'function') {
            e.preventDefault();
            liveLink.click();
            return;
          }
        }
        // Otherwise notify parent CineBox window to handle the click seamlessly
        try {
          if (window.parent && window.parent !== window) {
            e.preventDefault();
            window.parent.postMessage({
              type: 'ADSTERRA_MOVIE_CARD_CLICK',
              slot: slot,
              title: item.title
            }, '*');
          }
        } catch (err) {}
      }

      if (fallbackGrid) {
        fallbackGrid.innerHTML = '';
        for (var f = 0; f < activeFallbackCards.length; f++) {
          (function(item) {
            var cardEl = document.createElement('div');
            cardEl.className = 'cinebox-ad-card';
            cardEl.setAttribute('data-badge', item.badge);

            var linkEl = document.createElement('a');
            linkEl.href = '#watch-' + encodeURIComponent(item.title.toLowerCase().replace(/[^a-z0-9]+/g, '-'));
            linkEl.addEventListener('click', function(ev) {
              handleFallbackCardClick(ev, item);
            });

            var posterBox = document.createElement('div');
            posterBox.className = 'cinebox-ad-poster-box';

            var imgEl = document.createElement('img');
            imgEl.className = 'cinebox-ad-poster-img';
            imgEl.src = item.poster;
            imgEl.alt = item.title;
            imgEl.loading = 'eager';

            posterBox.appendChild(imgEl);

            var titleEl = document.createElement('div');
            titleEl.className = 'cinebox-ad-title';
            titleEl.textContent = item.title;

            var yearEl = document.createElement('div');
            yearEl.className = 'cinebox-ad-year';
            yearEl.textContent = item.year;

            linkEl.appendChild(posterBox);
            linkEl.appendChild(titleEl);
            linkEl.appendChild(yearEl);
            cardEl.appendChild(linkEl);
            fallbackGrid.appendChild(cardEl);
          })(activeFallbackCards[f]);
        }
      }

      function styleAdsterraAsMovieCards() {
        var root = document.querySelector('.adsterra-container');
        if (!root) return;

        // 1. Strictly hide leaf "Ad was closed" / "Ads by Adsterra" / close buttons without hiding parent cards
        var allEls = root.querySelectorAll('div, span, p, b, i');
        for (var i = 0; i < allEls.length; i++) {
          var el = allEls[i];
          var cls = (el.className && typeof el.className === 'string' ? el.className : '').toLowerCase();
          var isLeafText = el.children.length === 0;
          var txt = isLeafText ? (el.textContent || '').trim().toLowerCase() : '';

          if (
            cls.indexOf('__closed') !== -1 ||
            cls.indexOf('-closed') !== -1 ||
            cls.indexOf('__close') !== -1 ||
            cls.indexOf('-close') !== -1 ||
            cls.indexOf('__report') !== -1 ||
            cls.indexOf('__logo') !== -1 ||
            txt === 'ad was closed' ||
            txt === 'ads by adsterra'
          ) {
            el.style.setProperty('display', 'none', 'important');
          }
        }

        // 2. Locate Adsterra's repeating item container
        var gridParent = null;
        var explicitItems = root.querySelectorAll('[class*="__item"]');
        if (explicitItems && explicitItems.length >= 2 && explicitItems[0].parentElement) {
          gridParent = explicitItems[0].parentElement;
        } else {
          var candidates = [root].concat(Array.prototype.slice.call(root.querySelectorAll('div')));
          for (var c = 0; c < candidates.length; c++) {
            var cand = candidates[c];
            var children = cand.children;
            if (!children || children.length < 2) continue;
            var validCardCount = 0;
            for (var k = 0; k < children.length; k++) {
              var ch = children[k];
              if (ch.tagName === 'STYLE' || ch.tagName === 'SCRIPT') continue;
              if (ch.querySelector('a, img, [style*="background-image"]') || ch.tagName === 'A') {
                validCardCount++;
              }
            }
            if (validCardCount >= 2) {
              gridParent = cand;
              break;
            }
          }
        }

        if (!gridParent) {
          return;
        }

        var styledCardCount = 0;
        var rawCards = Array.prototype.slice.call(gridParent.children);

        for (var m = 0; m < rawCards.length; m++) {
          var card = rawCards[m];
          if (card.tagName === 'STYLE' || chTagNameIsIgnored(card)) continue;
          if (card.classList.contains('cinebox-companion-card')) {
            styledCardCount++;
            continue;
          }

          var hasLinkOrMedia =
            card.tagName === 'A' ||
            card.querySelector('a, img, [class*="__img"], [style*="background-image"]');
          if (!hasLinkOrMedia) continue;

          card.classList.add('cinebox-ad-card', 'adsterra-live-item');
          if (!card.getAttribute('data-badge')) {
            card.setAttribute('data-badge', m % 2 === 0 ? '1080P' : 'HD');
          }

          // Style image box & image element
          var imgBox = card.querySelector('[class*="__img-box"], [class*="__img-wrap"], [class*="__thumb"]');
          var bgEl = card.querySelector('[class*="__img"]:not([class*="__img-box"]):not([class*="__img-wrap"]), img');

          if (!bgEl) {
            var allInner = card.querySelectorAll('div, span');
            for (var b = 0; b < allInner.length; b++) {
              var candBg = allInner[b];
              var compBg = window.getComputedStyle(candBg).backgroundImage || candBg.style.backgroundImage;
              if (compBg && compBg !== 'none') {
                bgEl = candBg;
                break;
              }
            }
          }

          if (imgBox) {
            imgBox.classList.add('cinebox-ad-poster-box');
          }
          if (bgEl) {
            bgEl.classList.add('cinebox-ad-poster-img');
            if (!imgBox && bgEl.parentElement && bgEl.parentElement !== card) {
              bgEl.parentElement.classList.add('cinebox-ad-poster-box');
            }
          }

          // Style title element
          var titleNode = card.querySelector('[class*="__title"]:not([class*="__title-box"]), [class*="__header"]');
          if (!titleNode) {
            var textNodes = card.querySelectorAll('div, span, p');
            for (var t = 0; t < textNodes.length; t++) {
              var tn = textNodes[t];
              if (tn.children.length === 0) {
                var tContent = (tn.textContent || '').trim();
                if (tContent.length > 2 && tContent.toLowerCase() !== 'ad was closed') {
                  titleNode = tn;
                  break;
                }
              }
            }
          }
          if (titleNode) {
            titleNode.classList.add('cinebox-ad-title');
          }

          styledCardCount++;
        }

        if (styledCardCount >= 2) {
          gridParent.classList.add('cinebox-ad-grid');

          // If Adsterra injected 4 cards, append 2 companion cards so all 6 desktop columns match CineBox movie rows
          if (styledCardCount < 6 && !gridParent.querySelector('.cinebox-companion-card')) {
            var liveLinks = gridParent.querySelectorAll('a[href]');
            var needed = 6 - styledCardCount;
            for (var n = 0; n < needed; n++) {
              var fbItem = activeFallbackCards[(styledCardCount + n) % activeFallbackCards.length];
              var compCard = document.createElement('div');
              compCard.className = 'cinebox-ad-card cinebox-companion-card';
              compCard.setAttribute('data-badge', fbItem.badge);

              var compLink = document.createElement('a');
              if (liveLinks.length > 0) {
                compLink.href = liveLinks[n % liveLinks.length].href;
                compLink.target = '_blank';
                compLink.rel = 'noopener noreferrer';
              } else {
                compLink.href = '#featured';
                compLink.addEventListener('click', function(ev) {
                  handleFallbackCardClick(ev, fbItem);
                });
              }

              var cPosterBox = document.createElement('div');
              cPosterBox.className = 'cinebox-ad-poster-box';
              var cImg = document.createElement('img');
              cImg.className = 'cinebox-ad-poster-img';
              cImg.src = fbItem.poster;
              cImg.alt = fbItem.title;
              cPosterBox.appendChild(cImg);

              var cTitle = document.createElement('div');
              cTitle.className = 'cinebox-ad-title';
              cTitle.textContent = fbItem.title;

              var cYear = document.createElement('div');
              cYear.className = 'cinebox-ad-year';
              cYear.textContent = fbItem.year;

              compLink.appendChild(cPosterBox);
              compLink.appendChild(cTitle);
              compLink.appendChild(cYear);
              compCard.appendChild(compLink);
              gridParent.appendChild(compCard);
            }
          }

          // Hide fallback grid once live Adsterra grid is active and styled
          if (fallbackGrid) {
            fallbackGrid.style.setProperty('display', 'none', 'important');
          }
        }
      }

      function chTagNameIsIgnored(el) {
        return !el || el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'LINK';
      }

      var wrapper = document.getElementById('ad-wrapper');
      if (wrapper && typeof MutationObserver !== 'undefined') {
        var obs = new MutationObserver(function() {
          styleAdsterraAsMovieCards();
        });
        obs.observe(wrapper, { childList: true, subtree: true });
      }
      setInterval(styleAdsterraAsMovieCards, 500);
    })();
  </script>

  <script
    id="adsterra-invoke-script"
    async="async"
    data-cfasync="false"
    src="https://bancadeltempoidea.org/21/83b5d9d90d154535d150a2bd3cf1f04e"

  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var customZone = params.get('zone');
        if (customZone && customZone !== '83b5d9d90d154535d150a2bd3cf1f04e' && customZone.length > 8) {
          var targetDiv = document.getElementById('container-83b5d9d90d154535d150a2bd3cf1f04e');
          if (targetDiv) targetDiv.id = 'container-' + customZone;
          
          var oldScript = document.getElementById('adsterra-invoke-script');
          if (oldScript && oldScript.parentNode) oldScript.parentNode.removeChild(oldScript);

          var s = document.createElement('script');
          s.id = 'adsterra-invoke-script-custom';
          s.async = true;
          s.setAttribute('data-cfasync', 'false');
          s.src = 'https://bancadeltempoidea.org/21/' + customZone;
          s.onload = function() {
            try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'ADSTERRA_STATUS', status: 'loaded' }, '*'); } catch(e){}
          };
          s.onerror = function() {
            try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'ADSTERRA_STATUS', status: 'fallback' }, '*'); } catch(e){}
          };
          document.body.appendChild(s);
        }
      } catch(e) {}
    })();
  </script>
