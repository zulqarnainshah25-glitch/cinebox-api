apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.example.app"   // 👈 apna package name yahan rakhein
    compileSdk 35                 // 👈 YEH MISSING THA — ab add ho gaya

    defaultConfig {
        applicationId "com.example.app"   // 👈 apna applicationId
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // 👈 apni baaki dependencies yahan rakhein (Capacitor, Firebase, etc.)
}